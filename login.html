<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — JL Bedoya Group</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  * { box-sizing: border-box; }
  body{font-family:system-ui,Arial,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:1.5rem}
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:1.75rem}
  .brand .jlb{color:#84cc16;font-weight:900;font-size:1.9rem;letter-spacing:-.02em}
  .brand .group{color:#e2e8f0;font-weight:600;font-size:1.1rem}
  .card{background:#1e293b;padding:2.25rem 2rem;border-radius:16px;width:100%;max-width:380px;box-shadow:0 20px 50px rgba(0,0,0,.4);border:1px solid #334155}
  h1{font-size:1.05rem;margin:0 0 1.5rem;color:#e2e8f0;font-weight:700;text-align:center}
  .sub{text-align:center;color:#64748b;font-size:.8rem;margin:-1.1rem 0 1.5rem}
  label{display:block;font-size:.8rem;font-weight:600;margin-bottom:.35rem;color:#94a3b8}
  .campo{position:relative;margin-bottom:1.1rem}
  .campo i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:#64748b;width:16px;height:16px}
  input{width:100%;padding:.75rem .75rem .75rem 2.5rem;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-size:.95rem;outline:none;transition:border-color .15s}
  input:focus{border-color:#84cc16}
  button{width:100%;padding:.8rem;border:none;border-radius:8px;background:#84cc16;color:#0f172a;font-weight:700;font-size:.95rem;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:center;gap:8px}
  button:hover:not(:disabled){background:#a3e635}
  button:disabled{opacity:.6;cursor:default}
  .error{color:#f87171;font-size:.83rem;margin-bottom:1rem;min-height:1.2em;text-align:center}
  .apps-header{text-align:center;margin-bottom:1.5rem}
  .apps-header .hola{color:#64748b;font-size:.85rem;margin:0 0 .2rem}
  .apps-header .nombre{color:#e2e8f0;font-weight:700;font-size:1.1rem;margin:0;text-transform:capitalize}
  .grid-apps{display:grid;grid-template-columns:1fr 1fr;gap:.75rem}
  .app-tile{display:flex;flex-direction:column;align-items:center;gap:.6rem;padding:1.25rem .75rem;background:#0f172a;border:1px solid #334155;border-radius:12px;text-decoration:none;color:#e2e8f0;transition:border-color .15s,transform .1s}
  .app-tile:hover{border-color:#84cc16;transform:translateY(-2px)}
  .app-tile .icono-wrap{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .app-tile .icono-wrap i{width:22px;height:22px}
  .app-tile span{font-size:.78rem;font-weight:700;text-align:center;text-transform:uppercase;letter-spacing:.02em}
  .tile-produccion .icono-wrap{background:rgba(132,204,22,.15);color:#a3e635}
  .tile-pruebas .icono-wrap{background:rgba(168,85,247,.15);color:#c084fc}
  .tile-almacen .icono-wrap{background:rgba(59,130,246,.15);color:#60a5fa}
  .tile-gestion{grid-column:1/-1;flex-direction:row;justify-content:flex-start;padding:1rem 1.1rem;border-color:#3f3315;background:#1c1a10}
  .tile-gestion .icono-wrap{background:rgba(245,158,11,.18);color:#fbbf24;flex-shrink:0}
  .tile-gestion span{font-size:.85rem;text-transform:none;letter-spacing:0}
  .tile-gestion .desc{display:block;font-size:.72rem;font-weight:400;color:#94a3b8;text-transform:none;margin-top:2px}
  .salir{display:block;text-align:center;margin-top:1.25rem;color:#64748b;font-size:.78rem;text-decoration:none}
  .salir:hover{color:#94a3b8}
  #cambiarView .info{background:rgba(132,204,22,.1);border:1px solid rgba(132,204,22,.3);color:#bef264;font-size:.8rem;padding:.7rem .85rem;border-radius:8px;margin-bottom:1.25rem;line-height:1.4}
</style>
</head>
<body>
  <div style="width:100%;max-width:380px">
    <div class="brand"><span class="jlb">JLB</span><span class="group">Group</span></div>

    <div class="card">
      <div id="loginView">
        <h1>Acceso al sistema</h1>
        <div class="error" id="errorMsg"></div>
        <div class="campo">
          <i data-lucide="user"></i>
          <input id="usuario" type="text" autocomplete="username" placeholder="Usuario">
        </div>
        <div class="campo">
          <i data-lucide="lock"></i>
          <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña">
        </div>
        <button id="btnLogin"><i data-lucide="log-in" style="width:16px;height:16px"></i> Entrar</button>
      </div>

      <div id="cambiarView" style="display:none">
        <h1>Crea tu contraseña</h1>
        <div class="info">Por seguridad debes elegir tu propia contraseña antes de continuar. Mínimo 8 caracteres.</div>
        <div class="error" id="errorCambiar"></div>
        <div class="campo">
          <i data-lucide="lock"></i>
          <input id="passwordNueva" type="password" autocomplete="new-password" placeholder="Nueva contraseña">
        </div>
        <div class="campo">
          <i data-lucide="lock"></i>
          <input id="passwordNuevaConfirmar" type="password" autocomplete="new-password" placeholder="Confirma la contraseña">
        </div>
        <button id="btnCambiar"><i data-lucide="check" style="width:16px;height:16px"></i> Guardar y continuar</button>
      </div>

      <div id="appsView" style="display:none">
        <div class="apps-header">
          <p class="hola">Hola,</p>
          <p class="nombre" id="nombreUsuario">usuario</p>
        </div>
        <div class="grid-apps" id="appsList"></div>
        <a href="#" class="salir" id="btnSalir">Cerrar sesión</a>
      </div>
    </div>
  </div>

<script>
  var CONTROL_ACCESO_URL = 'https://script.google.com/macros/s/AKfycby4K-qxW87hfd9Fy1wKHeyF8bic_Qo8clKfJ-ZuPg9zElNuc7XOe8qTgW8sUmJ9mnKjDA/exec';
  var TOKEN_KEY = 'jlb_session_token';
  var USER_KEY = 'jlb_session_usuario';

  // Si el servicio está suspendido, mostrar de una vez la pantalla de suspensión por falta
  // de pago (sin pedir credenciales): la ven todos los roles que lleguen al login.
  fetch(CONTROL_ACCESO_URL + '?action=estadoServicio', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) { if (d && d.global === false) location.replace('./suspendido.html'); })
    .catch(function () {});

  var APP_URLS = {
    PRODUCCION: 'https://jlbedoyagroup.github.io/Produccion/',
    PRUEBAS: 'https://jlbedoyagroup.github.io/Produccion/VistaCampoPruebas.html',
    ALMACEN: 'https://jlbedoyagroup.github.io/Almacen/'
  };

  var APP_META = {
    PRODUCCION: { nombre: 'Producción', icono: 'kanban-square', clase: 'tile-produccion' },
    PRUEBAS: { nombre: 'Campo de pruebas', icono: 'flask-conical', clase: 'tile-pruebas' },
    ALMACEN: { nombre: 'Almacén', icono: 'package', clase: 'tile-almacen' }
  };

  var usuarioActual = '';
  var passwordActual = '';

  function qs(name) {
    return new URLSearchParams(location.search).get(name);
  }

  function crearIcono(nombre, extraAttrs) {
    var i = document.createElement('i');
    i.setAttribute('data-lucide', nombre);
    if (extraAttrs) Object.keys(extraAttrs).forEach(function (k) { i.setAttribute(k, extraAttrs[k]); });
    return i;
  }

  document.getElementById('btnLogin').addEventListener('click', function () {
    var usuario = document.getElementById('usuario').value.trim();
    var password = document.getElementById('password').value;
    var errorEl = document.getElementById('errorMsg');
    errorEl.textContent = '';

    if (!usuario || !password) {
      errorEl.textContent = 'Completa usuario y contraseña.';
      return;
    }

    var btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.innerHTML = 'Verificando...';

    var url = CONTROL_ACCESO_URL +
      '?action=login' +
      '&usuario=' + encodeURIComponent(usuario) +
      '&password=' + encodeURIComponent(password);

    fetch(url, { method: 'GET', cache: 'no-store' })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="log-in" style="width:16px;height:16px"></i> Entrar';
        if (typeof lucide !== 'undefined') lucide.createIcons();

        if (!data.ok) {
          errorEl.textContent = mensajeError(data.error);
          return;
        }

        usuarioActual = usuario;
        passwordActual = password;

        try {
          sessionStorage.setItem(TOKEN_KEY, data.token);
          sessionStorage.setItem(USER_KEY, usuario);
        } catch (e) {
          errorEl.textContent = 'El navegador bloqueó el almacenamiento de sesión.';
          return;
        }

        if (data.debeCambiar) {
          mostrarCambiarPassword();
          return;
        }

        continuarDespuesDeLogin(data.allowedApps, data.esGestorAccesos, data.role);
      })
      .catch(function () {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="log-in" style="width:16px;height:16px"></i> Entrar';
        if (typeof lucide !== 'undefined') lucide.createIcons();
        errorEl.textContent = 'No se pudo contactar el servidor. Intenta de nuevo.';
      });
  });

  function mensajeError(codigo) {
    if (codigo === 'servicio_suspendido') {
      location.replace('./suspendido.html');
    }
    var mensajes = {
      credenciales_invalidas: 'Usuario o contraseña incorrectos.',
      usuario_inactivo: 'Este usuario está deshabilitado.',
      servicio_suspendido: 'El servicio no está disponible actualmente.',
      credenciales_incompletas: 'Completa usuario y contraseña.'
    };
    return mensajes[codigo] || 'No se pudo iniciar sesión.';
  }

  function mostrarCambiarPassword() {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('cambiarView').style.display = 'block';
  }

  document.getElementById('btnCambiar').addEventListener('click', function () {
    var nueva = document.getElementById('passwordNueva').value;
    var confirmar = document.getElementById('passwordNuevaConfirmar').value;
    var errorEl = document.getElementById('errorCambiar');
    errorEl.textContent = '';

    if (!nueva || nueva.length < 8) {
      errorEl.textContent = 'La contraseña debe tener mínimo 8 caracteres.';
      return;
    }
    if (nueva !== confirmar) {
      errorEl.textContent = 'Las contraseñas no coinciden.';
      return;
    }

    var btn = document.getElementById('btnCambiar');
    btn.disabled = true;
    btn.innerHTML = 'Guardando...';

    fetch(CONTROL_ACCESO_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'changePassword', usuario: usuarioActual, oldPassword: passwordActual, newPassword: nueva })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="check" style="width:16px;height:16px"></i> Guardar y continuar';
        if (typeof lucide !== 'undefined') lucide.createIcons();

        if (!data.ok) {
          errorEl.textContent = 'No se pudo guardar la nueva contraseña, intenta de nuevo.';
          return;
        }

        passwordActual = nueva;
        document.getElementById('cambiarView').style.display = 'none';
        reloginSilencioso();
      })
      .catch(function () {
        btn.disabled = false;
        btn.innerHTML = '<i data-lucide="check" style="width:16px;height:16px"></i> Guardar y continuar';
        if (typeof lucide !== 'undefined') lucide.createIcons();
        errorEl.textContent = 'No se pudo contactar el servidor.';
      });
  });

  function reloginSilencioso() {
    var url = CONTROL_ACCESO_URL + '?action=login&usuario=' + encodeURIComponent(usuarioActual) + '&password=' + encodeURIComponent(passwordActual);
    fetch(url, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) return;
        try { sessionStorage.setItem(TOKEN_KEY, data.token); } catch (e) {}
        continuarDespuesDeLogin(data.allowedApps, data.esGestorAccesos, data.role);
      });
  }

  function continuarDespuesDeLogin(allowedApps, esGestorAccesos, role) {
    var redirect = qs('redirect');
    if (redirect) {
      location.replace(redirect);
      return;
    }
    mostrarSelectorApps(allowedApps, esGestorAccesos, role);
  }

  function mostrarSelectorApps(allowedApps, esGestorAccesos, role) {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('cambiarView').style.display = 'none';
    document.getElementById('nombreUsuario').textContent = usuarioActual;

    var list = document.getElementById('appsList');
    list.innerHTML = '';

    (allowedApps || []).forEach(function (app) {
      var meta = APP_META[app];
      var url = APP_URLS[app];
      if (!meta || !url) return;

      var a = document.createElement('a');
      a.href = url;
      a.className = 'app-tile ' + meta.clase;

      var iconoWrap = document.createElement('div');
      iconoWrap.className = 'icono-wrap';
      iconoWrap.appendChild(crearIcono(meta.icono));

      var span = document.createElement('span');
      span.textContent = meta.nombre;

      a.appendChild(iconoWrap);
      a.appendChild(span);
      list.appendChild(a);
    });

    if (esGestorAccesos || role === 'Administrador') {
      var a = document.createElement('a');
      a.href = 'gestion-accesos.html';
      a.className = 'app-tile tile-gestion';

      var iconoWrap = document.createElement('div');
      iconoWrap.className = 'icono-wrap';
      iconoWrap.appendChild(crearIcono('users-round'));

      var span = document.createElement('span');
      span.innerHTML = 'Gestión de accesos<span class="desc">Usuarios, contraseñas y permisos</span>';

      a.appendChild(iconoWrap);
      a.appendChild(span);
      list.appendChild(a);
    }

    document.getElementById('appsView').style.display = 'block';
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  document.getElementById('btnSalir').addEventListener('click', function (e) {
    e.preventDefault();
    try { sessionStorage.removeItem(TOKEN_KEY); sessionStorage.removeItem(USER_KEY); } catch (err) {}
    location.reload();
  });

  if (typeof lucide !== 'undefined') lucide.createIcons();
</script>
</body>
</html>
